# Settings for the Learning Zone version of the pages, used by
#   hugo server --environment learningzone       (a preview)
#   hugo --environment learningzone -d course-package   (a package, without the size reduction)
# The GitHub Action and themes/module/.github/actions/learning-zone/build.sh
# set these for you.
baseURL = "/"
relativeURLs = true
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT", "404"]

# The package build downloads the web fonts and Mermaid (for diagrams) once,
# and puts them in the package. These are the only addresses it may use.
[security.http]
  urls = ['^https://fonts\.googleapis\.com/', '^https://fonts\.gstatic\.com/', '^https://cdn\.jsdelivr\.net/npm/mermaid@']
