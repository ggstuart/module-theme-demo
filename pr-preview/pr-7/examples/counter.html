<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Counter</title>
<style>body{font-family:sans-serif;display:grid;place-items:center;height:90vh;margin:0}button{font-size:2rem;padding:.5em 1em}</style>
</head>
<body><button id="b">clicked 0 times</button>
<script>let n=0;b.onclick=()=>b.textContent=`clicked ${++n} time${n===1?"":"s"}`</script>
</body>
</html>
