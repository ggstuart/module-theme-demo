# Builds the website and publishes it with GitHub Pages, from the gh-pages branch.
#
# - Push to main: the site goes to the root of gh-pages
#   (https://<owner>.github.io/<repo>/), leaving pr-preview/ alone.
# - Pull request: the site is built for, and published at,
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/, and a comment on
#   the pull request links to it. Closing the pull request removes it.
#   Pull requests from forks are only built (no preview): their token can't
#   write to this repository.
# - Every build is also uploaded as an artifact named "website".
#
# Pages must be set to: Settings > Pages > Build and deployment >
# Source "Deploy from a branch", Branch "gh-pages" and "/ (root)".
# Until then the deploys still update gh-pages, and the run shows a note.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write        # push to the gh-pages branch
  pull-requests: write   # comment with the preview link

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Work out the site's address
        id: url
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}/"
          if [ -n "$PR" ]; then base="${base}pr-preview/pr-${PR}/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Building for $base"
      - name: Build the website
        run: hugo --gc --minify --baseURL "${{ steps.url.outputs.base }}"
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: public/
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: public
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean-exclude: pr-preview/
          commit-message: Deploy main ${{ github.sha }}
      - name: Is GitHub Pages turned on?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.source.branch // ""' 2>/dev/null || true)
          if [ "$source" != "gh-pages" ]; then
            echo "::notice title=Website not published yet::The site is on the gh-pages branch, but GitHub Pages doesn't serve it yet. An admin must open Settings > Pages and choose Source: Deploy from a branch, Branch: gh-pages, / (root)."
          fi

  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: public
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
