# Builds course-package.zip for Learning Zone on every change to main and on
# every pull request. Download it from the run's page, under "Artifacts".
name: Learning Zone package

on:
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # For now this is the branch proposed in ggstuart/Module#4. It will move to a
      # tagged release of ggstuart/Module (for example ggstuart/Module/...@v2026.1),
      # matching the theme submodule, once that exists.
      - uses: ggstuart-bot/Module/.github/actions/learning-zone@learning-zone-export
