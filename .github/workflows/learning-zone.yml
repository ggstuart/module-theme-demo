# Builds course-package.zip for Learning Zone every time you change something.
# Download it from the run's page, under "Artifacts".
name: Learning Zone package

on:
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ggstuart-bot/Module/.github/actions/learning-zone@learning-zone-export
